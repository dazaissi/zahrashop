name: Supabase Database Backup

on:
  schedule:
    # Berjalan setiap hari pada pukul 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # Memungkinkan Anda menjalankan backup manual dari GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run pg_dump Backup
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Membuat nama file berdasarkan tanggal hari ini
          FILENAME="backup_$(date +'%Y-%m-%d_%H-%M-%S').sql"
          
          # Menjalankan pg_dump
          # --no-owner dan --no-privileges untuk menghindari error role saat restore
          pg_dump "$DB_URL" --no-owner --no-privileges -f "$FILENAME"
          
          # Simpan nama file ke environment variable agar bisa dipakai di step selanjutnya
          echo "BACKUP_FILE=$FILENAME" >> $GITHUB_ENV

      - name: Upload Backup as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90 # File backup akan disimpan di GitHub selama 90 hari